server:
  port: 8085

spring:
  application:
    name: enigio-sample
  data:
    mongodb:
      uri: mongodb://localhost:27017/enigio_orchestrator
  kafka:
    bootstrap-servers: localhost:9092,localhost:9093,localhost:9094
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        # Rebalancing: only revoke partitions that need to move (no stop-the-world)
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
        # Container health detection
        session.timeout.ms: 30000
        heartbeat.interval.ms: 10000
        max.poll.interval.ms: 300000
        # Static membership for Kubernetes (uncomment for StatefulSet deployments):
        # group.instance.id: ${HOSTNAME}
        # session.timeout.ms: 45000
        # Rack awareness (uncomment to read from closest replica):
        # client.rack: ${KAFKA_RACK:rack-1}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    listener:
      # Consumer threads per instance — set to match partition count
      concurrency: 3
      # Commit offset after each message (not batch)
      ack-mode: RECORD

vendor:
  base-url: http://localhost:8081/api/v1

# Library config — only what the orchestrator starter needs
orchestrator:
  kafka:
    command-topic: enigio.sample.commands
  retry:
    max-attempts: 4
    initial-interval-ms: 2000
    multiplier: 2.0
    max-interval-ms: 30000
    jitter-factor: 0.5
  recovery:
    scan-interval-ms: 30000
    stale-threshold-minutes: 5

# Topics: create via kafka-topics CLI or IaC before deploying:
#   kafka-topics --create --topic enigio.sample.commands --partitions 6 --replication-factor 3
#   (retry/DLT topics are auto-created by Spring Kafka's RetryTopicConfiguration)
