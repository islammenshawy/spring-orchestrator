server:
  port: 8085

spring:
  application:
    name: enigio-sample

  mongodb:
    uri: mongodb://localhost:27017/enigio_orchestrator
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      ack-mode: record
# Vendor API
vendor:
  base-url: http://localhost:8081/api/v1

# Orchestrator — only the topic name is required, everything else has defaults
orchestrator:
  kafka:
    command-topic: enigio.sample.commands
  retry:
    initial-interval-ms: 5000
    multiplier: 2.0
    max-interval-ms: 30000
    max-attempts: 4
    jitter-factor: 0.5

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
