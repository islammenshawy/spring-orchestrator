        signature:
          type: string
          description: Metadata of the signature.
          example: |-
            Subject:
              Name: Alice
              ID: alice@enigio.com
              ID Type: E-mail
              Capacity of signatory: Tester
              Role: CTO
              Organisation: Enigio
            Accepted: true
            Method: DocuSign
            Signature: Signature is attached to the PDF original
        signedAt:
          type: string
          format: date-time
          description: Datetime of signature creation.
          example: '2022-06-16 07:03:49.852Z'
        signedBy:
          type: string
          description: Name of the signer completing the signature.
          example: Alice
    SignatureDataRequest:
      type: object
      properties:
        data:
          type: string
