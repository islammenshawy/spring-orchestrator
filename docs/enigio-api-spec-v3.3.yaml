        ownerKey:
          type: string
          description: The public key of the corresponding private key that you want to sign the data with.
          example: 03ecb34a49bff9c78ab2e4612fe44aa9549813eafc4a2670db1276ca71da50a1be
      required:
        - keyToSign
        - ownerKey
    SignedDataResponse:
      type: object
