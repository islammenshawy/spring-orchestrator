        ledgerSignature:
          type: string
          description: Ledger signature. Only present in documents created with trace:original schema v1.2 or earlier.
          example: zw0mAoeRaAL0LKfu79Yz329JNCjRkG2Ip8mavhjmJvyV+wfCA8elqWNjusjrr2hJj5j95wY2/jdW+M7ZQ0uAVg==
        ledgerTimestamp:
