components:
  schemas:
    AddRequiredSignature:
      type: object
      properties:
        capacityOfSignatory:
          type: string
          description: The capacity of the signer on this signature.
          example: Signatory
          minLength: 1
        documentVersion:
          type: number
          description: The document version to be signed.
          example: 1
        linkExpiresAt:
          type: string
          format: date-time
          description: When the unique signature link will expire, and needs to be renewed.
          example: '2022-06-16 07:03:49.852Z'
        organisation:
          type: string
          description: The organisation the signer of this signature represents.
          example: Enigio
        role:
          type: string
          description: The role of the signer on this signature.
          example: Signer
        signers:
          type: array
          description: List of possible signers to this specific required signature field. Only one of the signers can sign the required signature.
          items:
            $ref: '#/components/schemas/AddSigner'
        truncationOfExpiryDateOff:
          type: boolean
          description: This can be used to set to true if there is a need to not have the expiry link truncated to midnight of the date sent in. The expiry date will be set exactly as the UTC time sent in with millisecond precision if wanted. Default this is false, and is optional part of request.
          example: false
      required:
        - capacityOfSignatory
    AddSigner:
      type: object
      properties:
        email:
          type: string
          description: The email of the signer.
          example: alice@enigio.com
          minLength: 1
        identifications:
          type: array
          items:
            $ref: '#/components/schemas/AddSignerIdentification'
        name:
          type: string
          description: The name of the signer.
          example: Alice
        phone:
          type: string
          description: The phone number of the signer.
      required:
        - email
        - phone
    AddSignerIdentification:
      type: object
      properties:
        eid:
          type: string
          description: The eid of the signer that needs to be used for identification when signing.
          example: signer@enigio.com
        eidMethod:
          type: string
          description: The eid method provider that needs to be used for identification when signing.
          example: DOCUSIGN
        eidType:
          type: string
          description: The eid type that needs to be used for identification when signing.
          example: EMAIL
      required:
        - eid
        - eidMethod
        - eidType
    AdditionalDocumentResponse:
      type: object
      properties:
        contentType:
          type: string
          description: The content type of the additional document.
          example: application/pdf
        fileId:
          type: string
          description: The file identifier of the additional document.
          example: c410f92c-4c75-4467-a93a-e1152d694ee5
        filename:
          type: string
          description: The file name of the additional document.
          example: invoice.pdf
        filesize:
          type: integer
          format: int64
          description: The file size of the additional document.
          example: 243837
        hash:
          type: string
          description: The SHA-256 hash of the additional document.
          example: 98df1f1dfb3b1a123c1517912dc70447aa61c6be532ac99de973abb6219e1653
    Address:
      type: object
      properties:
        city:
          type: string
          description: City
        country:
          type: string
          description: Country
        line1:
          type: string
          description: Address line 1
        line2:
          type: string
          description: Address line 2
        zipCode:
          type: string
          description: ZIP code
    AmendDocumentRequest:
      type: object
      properties:
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentRequest'
        content:
          type: object
          additionalProperties: {}
          description: The content of the new amendment, the values of the provided JSON do not have to be ordered and the number of values that is provided is optional.
          example:
            Agreement terms: Some new terms
          minProperties: 1
        versionKey:
          type: string
          description: The private version key from the trace:original document's last amendment prior to this new amendment. This is needed to make sure that the latest current version of the trace:original document is known and that the amendment is made to the right version.
          example: d5f547f76a04ce34c4577b2072791d307fdf7e3df1fd40625f1ab81c16f363e4
      required:
        - content
        - versionKey
    AttachmentRequest:
      type: object
      properties:
        comment:
          type: string
          description: A comment describing the attachment. The comment will be shown in the structured data and in case of a PDF document it will also be visible as the description of the attachment in the PDF.
        data:
          type: string
          format: byte
          description: The file content. (binary)
          minLength: 1
        filename:
          type: string
          description: The file name of the attachment. The file name will be shown in the structured data and in case of a PDF document it will also be visible as the name of the attachment in the PDF.
          minLength: 1
      required:
        - data
        - filename
    AttachmentShortResponse:
      type: object
      properties:
        attachmentHash:
          type: string
          description: The SHA-256 hash of the attachment, can be used to retrieve more data on that specific attachment.
        filename:
          type: string
          description: The name of the attachment
    ContentResponse:
      type: object
      properties:
        content:
          description: The content of a version of the document. It can be an object or a string.
          example:
            Agreement terms: Some terms
            Reference: '100000'
            Agreement type: Generic
        version:
          type: integer
          format: int64
          description: The version of the document the content was extracted from.
          example: 3
    CreateDocumentRequest:
      type: object
      properties:
        attachments:
          type: array
          description: Attachments to be added to the new original document. In case of a PDF original, the attachments will be embedded in the PDF document as attachments (can be seen in Adobe reader under the "paper clip"). For YAML original documents the attachments will be stored in the document store of this node.
          items:
            $ref: '#/components/schemas/AttachmentRequest'
        content:
          type: object
          additionalProperties: {}
          description: The initial content for this document, the values of the provided JSON do not have to be ordered and the number of values that is provided is optional.
          example:
            Agreement terms: Some terms
            Reference: '100000'
            Agreement type: Generic
          minProperties: 1
        contentSchemaUrl:
          type: string
          description: The content schema URL is optional and will associate the document with a JSON schema. If content schema is not set then locale must be provided in the request.
        customData:
          type: object
          additionalProperties: {}
          description: Custom data field used to store data provided by the customer which will be validated against the schemas specified in ```customDataSchemaUrls``` field. When ```FILL_PDF_FORM_WITH_CUSTOM_DATA``` is provided as ```pdfFormOperation``` in the ```initialPDF``` object then the form in the initial PDF will be filled with the data from this field and the keys of the custom data need to match the name of the fields in the PDF form. When ```EXTRACT_PDF_FORM_TO_CUSTOM_DATA``` is provided as ```pdfFormOperation``` in the ```initialPDF``` object then the data from the form in the initial PDF will be extracted and stored in this field.
          example:
            placeOfIssue: Stockholm
            referenceNo: Ref 001
            amountInFigures: 1 000 000
            dateOfIssue: '2023-01-01T00:00:00.000Z'
            currencyCode: EUR
        customDataSchemaUrls:
          type: array
          description: Custom data schemas are optional and will associate and validate the custom data field with these JSON schemas. The schemas can be provided as HTTP or Data URLs.
          items:
            type: string
        documentCode:
          type: string
          description: Enigio charges a one-time fee for each document created with trace:original. The charge depends on the features of each document, such as negotiable instruments, documents of title, certificates, invoices, agreements, etc. Read more at <a target="_blank" href="https://enigio.com/traceoriginal/pricing/">https://enigio.com/traceoriginal/pricing/</a><br/><br/>Available values:<br/>  NEG - Negotiable<br/>  TTL - Title<br/>  RGS - Registry<br/>  RGN - Registry (no update)<br/>  AGT - Agreement
          enum:
            - NEG
            - TTL
            - RGS
            - RGN
            - AGT
        documentType:
          type: string
          description: 'Value that can be used for specifying the intended type of document/instrument, the value can be used by recipients to determine where in workflow the document should be handled or how data should be interpreted. Recommended values: ''Generic'', ''Guarantee'', ''Promissory note'', ''Mortgage'', ''CMR'', ''Bill of lading'', ''Agreement'', ''Contract'', ''Testament'',, ''Certificate'', ''Purchase order'', ''Minutes'', ''Invoice'', ''Tender'', ''Receipt'', ''Ticket'', ''Power of attorney'', ''Letter of credit'''
          maximum: 250
          minLength: 1
        format:
          type: string
          default: PDF
          description: The document format the created original will get.
          enum:
            - YAML
            - PDF
        initialPDF:
          $ref: '#/components/schemas/InitialPDF'
          description: The file size of the PDF file used as the initial PDF cannot be greater than 20 MB. It cannot contain attachments, comments, e-signatures or e-seals. Using an already existing trace:original document as initial PDF isn't allowed and password protected PDF's as initial PDF is not supported.
        locale:
          type: string
          description: The target language of the document.
          enum:
            - en
            - sv
        ownerKey:
          type: string
          description: The public owner key can be specified to create the document with this key as holder at creation. The private key corresponding to this public key must exist in the keystore of this node.
        reference:
          type: string
          description: Custom reference for the original to be set by the creator, any ID or other text that can be used for identifying or describing this original document. For example a specific use case ID or internal workflow ID for the instrument.
          maximum: 250
          minLength: 1
        renderCustomData:
          type: boolean
          default: false
          description: Whenever the custom data should be rendered in the PDF document. If true then the data from the ```customData``` field will be rendered in the initial content.
      required:
        - content
        - documentCode
        - documentType
        - reference
    CreateKeyPairAndSignResponse:
      type: object
      properties:
        ownerKey:
          type: string
          description: The public key of the created key pair.
          example: 03ecb34a49bff9c78ab2e4612fe44aa9549813eafc4a2670db1276ca71da50a1be
        ownerSignature:
          type: string
          description: The signature of the newly created public key signed using the corresponding private key.In order to prove that this keystore owns the private key.
          example: Bnm+2IOiDRe1s7VHvPHuRn2vbnTcFzIMcOQiETFo0igB+MosyF3siSPjNHBoK6KHWgReUZpxBBG3CJqWxKDoug==
      required:
        - ownerKey
        - ownerSignature
    CreateProofOfPossessionRequest:
      type: object
      properties:
        comment:
          type: string
          description: Comment
        locale:
          type: string
          description: The language the proof of possession should be generated in.
          enum:
            - en
            - sv
        owner:
          $ref: '#/components/schemas/Owner'
          description: Information about the owner of the document
        versionKey:
          type: string
          description: The private version key from the trace:original document's last amendment.
          example: d5f547f76a04ce34c4577b2072791d307fdf7e3df1fd40625f1ab81c16f363e4
      required:
        - comment
        - locale
        - owner
        - versionKey
    CreateProofOfPossessionResponse:
      type: object
      properties:
        proofOfPossession:
          type: string
          description: The created proof of possession in YAML format.
          minLength: 1
      required:
        - proofOfPossession
    CustomDataResponse:
      type: object
      properties:
        customData:
          type: object
          additionalProperties: {}
          description: The custom data of a version of the document
          example:
            placeOfIssue: Stockholm
            referenceNo: Ref 001
            amountInFigures: 1 000 000
            dateOfIssue: '2023-01-01T00:00:00.000Z'
            currencyCode: EUR
        version:
          type: integer
          format: int64
          description: The version of the document the custom data was extracted from.
          example: 2
    DocumentMetadataResponse:
      type: object
      properties:
        copy:
          type: boolean
          default: false
          description: Whenever the document is a copy. If true then the document is not owned by the current node. It has been transferred from or uploaded to this node but the key pair owning the document does not exists in the keystore of this node.
        documentCode:
          type: string
          description: Enigio charges a one-time fee for each document created with trace:original. The charge depends on the features of each document, such as negotiable instruments, documents of title, certificates, invoices, agreements, etc. Read more at <a target="_blank" href="https://enigio.com/traceoriginal/pricing/">https://enigio.com/traceoriginal/pricing/</a><br/><br/>Available values:<br/>  NEG - Negotiable<br/>  TTL - Title<br/>  RGS - Registry<br/>  RGN - Registry (no update)<br/>  AGT - Agreement
          enum:
            - NEG
            - TTL
            - RGS
            - RGN
            - AGT
            - ENV
        documentType:
          type: string
          description: The document type of the document.
        filename:
          type: string
          description: The file name of the document.
        format:
          type: string
          description: The format of the document.
          enum:
            - YAML
            - PDF
        inTransit:
          type: boolean
          default: false
          description: Whenever the document is being transferred. If true then no operations can be done on the document until the transfer is cancelled or fulfilled.
        invalidated:
          type: boolean
          default: false
          description: Whenever the document is invalidated. If true then no more operations can be done on the document. It has reached its end state.
        ownerKey:
          type: string
          description: The public key corresponding to the actual private owner key.
        reference:
          type: string
          description: The reference of the document.
        traceOriginalId:
          type: string
          description: The trace:original ID of the document.
        version:
          type: integer
          format: int64
          description: The actual version of the document.
