    WebhookUpdateRequest:
      type: object
      description: Request payload for updating an existing webhook
      properties:
        url:
          type: string
          description: The URL where webhook events will be delivered.
          example: https://api.example.com/webhooks/events
        scope:
          type: string
          description: |
            Defines which document changes trigger callbacks.

            - ```ALL``` - Any changes to existing documents in the document storage will trigger webhooks, even if the document is a copy that has been transferred and the changes were done by an another node.
            - ```OWNED_ONLY``` - Changes to documents in the document storage will trigger webhooks only if the documents are owned by this node.
          enum:
            - ALL
            - OWNED_ONLY
          example: OWNED_ONLY
        signatureMethod:
          type: string
          default: NONE
          description: Signing method for webhook payloads
          enum:
            - NONE
            - JWS
        eventTypes:
          type: array
          items:
            type: string
            enum:
              - CREATE
              - AMENDMENT
              - TRANSFER_INITIATED
              - TRANSFER_CANCELLED
              - TRANSFER
              - TRANSFER_REJECTED
              - INVALIDATE
              - FULLY_SIGNED
              - PARTIALLY_SIGNED
              - SIGNATURE_REJECTED
              - SIGNATURE
