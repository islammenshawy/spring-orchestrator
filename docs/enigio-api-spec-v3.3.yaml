        versionKey:
          type: string
          description: The private version key from the trace:original document's last amendment prior to this new transfer operation. This is needed to make sure that the latest current version of the trace:original document is known and that the transfer is made to the right version.
          example: d5f547f76a04ce34c4577b2072791d307fdf7e3df1fd40625f1ab81c16f363e4
