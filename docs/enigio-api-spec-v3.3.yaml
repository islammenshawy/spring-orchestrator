    LedgerEntryDTO:
      type: object
      properties:
        contentHash:
          type: string
          description: Hash on the content of the document.
          example: 542a48f50bae2bd8fbe301eabbdeab99daf60f5c9bd6cc3debf9a230a0d0461d
        documentCode:
          type: string
          description: The document code of the document.
          example: NEG
        documentHash:
          type: string
          description: Hash on the document as a whole.
          example: 542a48f50bae2bd8fbe301eabbdeab99daf60f5c9bd6cc3debf9a230a0d0461d
        documentTimestamp:
          type: string
          format: date-time
          description: Timestamp when the document was created.
          example: '2022-06-16 07:03:49.852Z'
        documentVersion:
          type: number
          description: The version of the document.
          example: 1
        ledgerSeal:
          type: string
          description: The seal that joins the content of this row in ledger together with the rest of the ledger.
          example: jvfXIj9o/k+KO5GDeujDHyGGFHH9ked7GejF6aiGiXTPSwvg5jk6bOrByfcnZD+quBa2D0oaND3MghSr5wye7A==
        ledgerSignature:
          type: string
          description: The signature of this document using the ledger's private key.
          example: jsxJhBM2FxcpVjrp2iGkEBbtHrk/xQjasad0fB+QK/zqQW4VEuCERxUmKKHvJYjrUh7K4vt0iKlcB6qTn0UG6A==
        ledgerTimestamp:
          type: string
          format: date-time
          description: Timestamp when the ledger added the original
          example: '2022-06-16 07:03:49.852Z'
        ownerKey:
          type: string
          description: The public key that has ownership of the document.
          example: 02b9bc72e1a6fb87de88772d68e550afe3e0709d40f5e80a08a84987ddaa985786
        ownerSignature:
          type: string
          description: The signature of this document using the ```ownerKey```.
          example: jsxJhBM2FxcpVjrp2iGkEBbtHrk/xQjasad0fB+QK/zqQW4VEuCERxUmKKHvJYjrUh7K4vt0iKlcB6qTn0UG6A==
        ownerSignedData:
          type: string
          description: The data that was signed with the ```ownerKey``` for ```ownerSignature```.
          example: 542a48f50bae2bd8fbe301eabbdeab99daf60f5c9bd6cc3debf9a230a0d0461d
        pdfContentHash:
          type: string
          description: Hash on the content of the pdf in the document.
          example: 542a48f50bae2bd8fbe301eabbdeab99daf60f5c9bd6cc3debf9a230a0d0461d
        pdfDocumentHash:
          type: string
          description: Hash on the document with the pdf in the document.
          example: 542a48f50bae2bd8fbe301eabbdeab99daf60f5c9bd6cc3debf9a230a0d0461d
        row:
          type: number
          description: The row number of the original version in the ledger.
          example: 1
        traceOriginalId:
          type: string
          description: trace:original ID of the document.
          example: b6b2a956396563c403611662b57e5f851e5049998c7cc72cf73e4acb65084586
        type:
          type: string
          description: The type of ledger operation done on that version the document.
          example: CRE
        versionKey:
          type: string
          description: The corresponding public key of key pair that signed this version of the document.
          example: 03e64cba777b8657c6b1af08e91c123f44900d1628b74edd7ea208a24e4b5be996
        versionSignature:
          type: string
          description: The signature of this document using the ```versionKey```.
          example: jsxJhBM2FxcpVjrp2iGkEBbtHrk/xQjasad0fB+QK/zqQW4VEuCERxUmKKHvJYjrUh7K4vt0iKlcB6qTn0UG6A==
      required:
        - contentHash
        - documentCode
        - documentHash
        - documentTimestamp
        - documentVersion
        - ledgerSeal
        - ledgerSignature
        - ledgerTimestamp
        - ownerKey
        - ownerSignature
        - row
        - traceOriginalId
        - type
        - versionKey
        - versionSignature
