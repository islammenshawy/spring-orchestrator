tags:
  - description: These endpoints are for creating and managing trace:original documents.
    name: Documents
    x-displayName: Documents
  - description: These endpoints are for creating new key-pairs and using current key-pairs in the fullnode's keystore for signing.
    name: Keys
    x-displayName: Keys
  - description: The envelope endpoints are for creating and managing trace:original envelopes. The purpose of an envelope is to securely transferring a selected set of documents to any recipient via email transfer. An envelope can contain both trace:original documents and other types of additional documents (PDF, JPG, etc.). When preparing an envelope, trace:original documents can be added as either originals or verifiable copies. The control of an original (possession) will transfer to the receiver after the envelope has been received and opened. Verifiable copies of originals will not change possession. To create an envelope, you must first generate a draft, which must then be sealed to produce the final envelope that should be sent. Until the draft is sealed, it remains editable, allowing updates and the inclusion or removal of trace:original and additional documents. The total number of documents in original documents, copies and additional documents must not exceed the limit of 25.
    name: Envelopes
    x-displayName: Envelopes
  - description: These endpoints are used to manage required signatures and signatures fields on the documents.
    name: Required signatures
    x-displayName: Required signatures
  - description: These endpoints can be used to check the entries available in this fullnode local ledger.
    name: Ledger
    x-displayName: Ledger
  - description: These endpoints are meant to help with creating reports that keep track of trace:original documents managed by this fullnode, and the users who have managed the documents.
    name: Reports
    x-displayName: Reports
  - name: E-mail notifications
    description: These endpoints are for managing notification recipients for trace:original.
    x-displayName: E-mail notifications
  - name: Webhooks
    description: |
      These endpoints are used to manage API webhooks.
      A webhook can only be registered once per URL. Whenever an operation is performed on a document within
      this node’s document store, all registered webhook URLs subscribed to that specific event will receive
      an HTTP POST request containing the following payload:

      Example payload for webhook message sent without signatures in the payload if signature method is set to ```NONE```:

      Payload delivered as plain JSON with Content-Type: ```application/json```

      ```
      {
          "messageId":"019a36a9-b031-7001-8348-2cc71e288d4a",
          "traceOriginalId":"1ff401aa69d511402c452c100cfa63afe9bbf029d1b216303f779e09508118f7",
          "draftId":"draft_558915817d501e2487381d769572a49e22ab8cb0b84bab1137107f3421",
          "eventType":"CREATE",
          "documentCode":"ENV",
          "reference":"Ref 0123456789",
          "documentType":"Envelope"
      }
      ```

      Example payload for webhook message signed using JSON Web Signature (JWS) standard (RFC 7515)
      if signature method is set to ```JWS```:

      Payload delivered as JWT with Content-Type: ```application/jwt```

      ```
      eyJraWQiOiIwMTlhMDVkMS0wNWUxLTc3ODctOTMwYS0zOGZkYjdlMTk5MDEiLCJhbGciOiJFUzI1NiJ9.eyJtZXNzYWdlSWQiOiI
      wMTlhMzZhOS1iMDMxLTcwMDEtODM0OC0yY2M3MWUyODhkNGEiLCJ0cmFjZU9yaWdpbmFsSWQiOiIxZmY0MDFhYTY5ZDUxMTQwMmM
      0NTJjMTAwY2ZhNjNhZmU5YmJmMDI5ZDFiMjE2MzAzZjc3OWUwOTUwODExOGY3IiwiZHJhZnRJZCI6ImRyYWZ0XzU1ODkxNTgxN2Q
      1MDFlMjQ4NzM4MWQ3Njk1NzJhNDllMjJhYjhjYjBiODRiYWIxMTM3MTA3ZjM0MjEiLCJldmVudFR5cGUiOiJDUkVBVEUiLCJkb2N
      1bWVudENvZGUiOiJFTlYiLCJyZWZlcmVuY2UiOiJSZWYgMDEyMzQ1Njc4OSIsImRvY3VtZW50VHlwZSI6IkVudmVsb3BlIn0.q7F
      Avk9T8hBsaaUMzBkoVUgiqGKo5Pu3QNE8-l_1zGTHwvNOSYl26tuaYwpnRvJY5T0oZLsW-_dCTBearonaSA
      ```

      The JWT follows the JWS Compact Serialization format, consisting of three dot-separated, Base64URL-encoded components: header, payload, and signature.

      - Header: Contains ```'alg'``` which is always set to ```ES256``` and ```'kid'``` (key ID) e.g. ```4029a646-9fb2-42a5-8e03-66c336461ac2```
      - Payload: Contains webhook event data
      - Signature: ```ES256``` signature of header and payload

      Receivers should verify the signature using the JWKS endpoint. Public keys for signature verification are
      available at: `https://example.com/.well-known/jwks.json`

      Example response:

      ```
      {
          "keys": [
              {
                  "kty":"EC",
                  "use":"sig",
                  "crv":"P-256",
                  "kid":"019a05d1-05e1-7787-930a-38fdb7e19901",
                  "x":"oh9xQ8uqNVz7wvhrN2fsWG5IPHgruOJg52chzZIr-q4",
                  "y":"TdbfXOjeR16sJnubBeH4ZvVHgMIaWF_n7Dng0onBnP4",
                  "iat":1761034175
              }
          ]
      }
      ```

      List of event types using webhook API:

      - ```CREATE``` - Document or envelope created.
      - ```AMENDMENT``` - Document amended.
      - ```TRANSFER_INITIATED``` - Transfer initiated for document or envelope.
      - ```TRANSFER``` - Document transferred.
      - ```TRANSFER_CANCELLED``` - Transfer cancelled by the transferer.
      - ```TRANSFER_REJECTED``` - Transfer rejected by the transferee.
      - ```INVALIDATE``` - Document or envelope invalidated.
      - ```FULLY_SIGNED``` - All pending signatures for this document have been signed.
      - ```PARTIALLY_SIGNED``` - One of the pending signatures has been signed but there are still pending signatures for the document.
      - ```SIGNATURE_REJECTED``` - Signature rejected by the signer.
      - ```SIGNATURE``` - A signature is added to the document but the document is not owned by this node so it isn't possible to determine more specific event.
      - ```CHANGE_TO_PAPER``` - Document changed to other electronic original medium using secure MLETR compliant process. The trace:original document is no longer the current original the new electronic medium is the current original.
      - ```CREATE_FROM_PAPER``` - Document created from paper using secure MLETR compliant process, the paper is no longer the original the trace:original document is now the current original.
      - ```CHANGE_TO_MEDIUM``` - Document changed to other electronic original medium using secure MLETR compliant process. The trace:original document is no longer the current original the new electronic medium is the current original.
      - ```CREATE_FROM_MEDIUM``` - Document created from other electronic original medium using secure MLETR compliant process. The other electronic medium is no longer the current original, the created trace:original document is the current original.
      - ```WITHDRAW``` - Document withdrawn from the document storage of this node.
      - ```UPLOAD``` - Document uploaded to the document storage of this node.
    x-displayName: Webhooks
  - name: API callbacks (Deprecated)
    description: |
      These endpoints are deprecated and will not be supported after 2026-11-01.

      These endpoints are for managing API callback URLs. The callback URLs only need to be registered once
      and every time an operation has been done on any document in the document store of this node the
      callback URLs will be called with POST method and the following payload:

      ```
          {
            "messageId": "f223b9c2-9a01-4705-b385-7aa5132434f1",
            "eventList": [
              {
                  "traceOriginalId": "f108965b08209baf365b6c538b7452dd5163ed440d4af78bb2a44be1b18759e7",
                  "eventType": "SIGNATURE_FULLY"
              }
            ]
          }
      ```

      List of event types:
        AMENDMENT, TRANSFER, INVALIDATE, SIGNATURE_REJECTED, SIGNATURE_FULLY, SIGNATURE_PARTIAL
    x-displayName: API callbacks (Deprecated)
paths:
  /api/v1/documents:
    post:
      description: This endpoint creates a new digital original document. The content for the created document should always follow the schemas provided in the request.
      operationId: createDocument
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentOperationResponse'
          description: Document created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error with description
      summary: Create a new document
      tags:
        - Documents
      security:
        - Basic Authentication: []
          JWT Bearer: []
  /api/v1/documents/metadata:
    get:
      description: Returns a list of the document metadata for documents stored in the document store of this node. The list is sorted by version creation date, with the most recently created or updated documents appearing first and paginated with a default page size of 20.
      operationId: getDocumentMetadataList
      parameters:
        - in: query
          name: perPage
          required: false
          schema:
            type: integer
            format: int32
            default: 20
            maximum: 100
        - in: query
          name: page
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocumentMetadataResponse'
          description: Returns a list of document metadata
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error with description
      summary: Retrieve a list of document metadata
      tags:
        - Documents
      security:
        - Basic Authentication: []
          JWT Bearer: []
  /api/v1/documents/upload:
    post:
      description: Upload a trace:original document which will be stored in the document store of this fullnode. The document has to be a current valid original.
      operationId: uploadDocument
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadDocumentRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DocumentOperationResponse'
          description: Document uploaded
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error with description
      summary: Upload a document
      tags:
        - Documents
      security:
        - Basic Authentication: []
          JWT Bearer: []
  /api/v1/documents/validate:
    post:
      description: |-
        The original document or proof of ownership document to be validated is provided in the request body.
        A validation result and optional details are returned in the response body. Result can be one of the following:
        - VALID: The validation of the document has been verified successfully with the fullnode local ledger. This is a current original.
        - NOT_VALID: The document is not valid.
        - OUTDATED: The document is not up to date. There is a later version of the document
        - CANNOT_VALIDATE: The document has data which is not in the fullnode copy of the public ledger.
        details (optional): If the result is not valid, a string specifying the error will be returned here.
      operationId: validateDocument
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateDocumentRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateDocumentResponse'
          description: Validation result
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error with description
      summary: Validate a document
      tags:
        - Documents
      security:
        - Basic Authentication: []
          JWT Bearer: []
  /api/v1/documents/{traceOriginalId}:
    delete:
      description: This endpoint is called to withdraw a trace:original document from the document store of this node. The document is still an original, but to not lose this original it is critical to fetch and store the document somewhere else if it should be possible to upload it later and continue to manage it at the node. If the document is withdrawn without making a backup the original will be lost.
      operationId: withdrawDocument
      parameters:
        - description: The trace:original ID of the document.
          in: path
          name: traceOriginalId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document withdrawn
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error with description
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Document was not found
      summary: Withdraw a document
      tags:
        - Documents
      security:
        - Basic Authentication: []
          JWT Bearer: []
    get:
      description: A call to this endpoint will return the latest version of a trace:original document corresponding to the given id.
      operationId: downloadDocument
      parameters:
        - description: The trace:original ID of the document.
          in: path
          name: traceOriginalId
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadDocumentResponse'
          description: Returns the document
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error with description
        '404':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DownloadDocumentResponse'
          description: Document was not found
      summary: Retrieve a document
      tags:
        - Documents
      security:
        - Basic Authentication: []
          JWT Bearer: []
  /api/v1/documents/{traceOriginalId}/amend:
    post:
      description: This endpoint adds new content as an amendment to the end of the current latest version of an existing trace:original document.
      operationId: amendDocument
      parameters:
        - description: The trace:original ID of the document.
          in: path
          name: traceOriginalId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmendDocumentRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentOperationResponse'
          description: Document amended
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error with description
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Document was not found
      summary: Amend a document
      tags:
        - Documents
      security:
        - Basic Authentication: []
          JWT Bearer: []
  /api/v1/documents/{traceOriginalId}/attachments:
    get:
      description: This endpoint will get all attachment metadata for the document.
      operationId: getAttachmentsForOriginal
      parameters:
        - description: The trace:original ID of the document.
          in: path
          name: traceOriginalId
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttachmentShortResponse'
          description: Attachments fetched.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error with description
      summary: Get all attachment metadata for the document
      tags:
        - Documents
      security:
        - Basic Authentication: []
          JWT Bearer: []
  /api/v1/documents/{traceOriginalId}/attachments/{attachmentHash}:
    get:
      description: This endpoint will get the given attachment from that document.
      operationId: getAttachmentForDocument
      parameters:
        - description: The trace:original ID of the document.
          in: path
          name: traceOriginalId
          required: true
          schema:
            type: string
        - description: The attachment hash of the attachment in that document.
          in: path
          name: attachmentHash
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAttachmentResponse'
          description: Attachments fetched.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error with description
      summary: Get a single attachment for the document
      tags:
        - Documents
      security:
        - Basic Authentication: []
          JWT Bearer: []
  /api/v1/documents/{traceOriginalId}/content:
    get:
      description: 'A call to this endpoint will return all content for the given document. '
      operationId: getContent
      parameters:
        - description: The trace:original ID of an existing document
          in: path
          name: traceOriginalId
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentResponse'
          description: List of content returned
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error with description
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Document was not found
      summary: Get all content for a document
      tags:
        - Documents
      security:
        - Basic Authentication: []
          JWT Bearer: []
  /api/v1/documents/{traceOriginalId}/custom-data:
    get:
      description: 'A call to this endpoint will return all custom data for the given document. '
      operationId: getCustomData
      parameters:
        - description: The trace:original ID of an existing document
          in: path
          name: traceOriginalId
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomDataResponse'
          description: List of custom data returned
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error with description
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Document was not found
      summary: Get all custom data for a document
      tags:
        - Documents
      security:
        - Basic Authentication: []
          JWT Bearer: []
  /api/v1/documents/{traceOriginalId}/invalidate:
    post:
      description: This endpoint will invalidate the legal current stature of the document and put it in its end state. No one is in possession, no one can add or update anymore. But the last version of the document is still possible to validate against the ledger.
      operationId: invalidateDocument
      parameters:
        - description: The trace:original ID of the document.
          in: path
          name: traceOriginalId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvalidateDocumentRequest'
        required: true
      responses:
        '200':
          description: Document invalidated
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Error with description
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Document was not found
      summary: Invalidate a document
      tags:
        - Documents
      security:
        - Basic Authentication: []
          JWT Bearer: []
  /api/v1/documents/{traceOriginalId}/metadata:
    get:
      description: A call to this endpoint will return the metadata for a document corresponding to the given id.
      operationId: getDocumentMetadata
      parameters:
        - description: The trace:original ID of the document.
          in: path
          name: traceOriginalId
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentMetadataResponse'
          description: Returns the metadata for a document
        '400':
          content:
            application/json:
              schema:
