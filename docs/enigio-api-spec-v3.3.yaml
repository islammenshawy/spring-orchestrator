info:
  description: |+
    Available API versions: &nbsp;<a href="#" onclick="initRedoc('trace-original-fullnode-api-specification-2.6.2.24-59d064d7.yaml', event)">2.6</a>&nbsp;&nbsp;|&nbsp;&nbsp;<a href="#" onclick="initRedoc('trace-original-fullnode-api-specification-2.7.0.7-1a537ae2.yaml', event)">2.7</a>&nbsp;&nbsp;|&nbsp;&nbsp;<a href="#" onclick="initRedoc('trace-original-fullnode-api-specification-3.0.0.28-aba5ea5a.yaml', event)">3.0</a>&nbsp;&nbsp;|&nbsp;&nbsp;<a href="#" onclick="initRedoc('trace-original-fullnode-api-specification-3.1.0.59-294d6b53.yaml', event)">3.1</a>&nbsp;&nbsp;|&nbsp;&nbsp;<a href="#" onclick="initLatest(event)">3.3&nbsp;(latest)</a>
    # Overview
    This documentation aims to provide all the information needed to easily integrate with the trace:original
    fullnode API including a list of all endpoints with description, request and response samples and API
    collections. The trace:original fullnode API is based on REST principles, accepts requests and returns
    responses in JSON format, uses standard HTTP response codes and supports GET, POST, PUT and
    DELETE HTTP methods.

    The API provides a range of endpoints which allows customers to integrate their application to be
    able to create and manage trace:original documents. These documents are digital original documents
    whose creation, possession, amendments, transfer, invalidations and integrity are securely logged in a
    public immutable distributed ledger. Only the holder, the one in possession, of the original can amend or
    invalidate a trace:original document or transfer ownership to another party. The primary use case are for
    any kind of negotiable document or document of title such as Promissory Notes, Bills of Exchange, Bills of
    Lading, Guarantees, Standby Letters of Credit and others. But as the documents are not limited to any
    specific content, in fact any PDF draft or a PDF draft form can be used to create a digital original. Thus
    the documents can also be used for Registry documents and regular Agreements such as Certificates of
    Origin, Student grades, Contracts and others.

    A document can be issued as a unique trace:original document with a unique trace:original ID recorded in
    the ledger by using the <strong>Create</strong> endpoint. This will generate a new record in the trace:original ledger.
    Nothing from the content of the document file will be logged in the public ledger, only cryptographic
    references, digital signatures and cryptographic keys. Via API it is possible to call <strong>Amend</strong> to add a new
    increment to the end of the document creating new versions. It is possible to add required signers that
    can electronically sign the document via a signing link. It is possible to <strong>Transfer</strong> the document to a holder
    in due course. It is possible to <strong>Invalidate</strong> the document when it should no longer give the holder any legal
    rights. The document can always be validated as the current correct, un-manipulated original, via
    <strong>Validate</strong> or at a public notary web-application verifying against the trace:original ledger like https://
    traceoriginal.com.

    ## Basic concepts

    ### trace:original ID
    Each trace:original document is identified by a unique trace:original ID. This id cannot be modified and will identify the document during its lifetime. 

    ### Version key
    Each version of the document is also identified by a version key which will be needed to be able to perform operations on the document which modify the document's state in the ledger. After each operation the new version key is returned in the response. It can also be retrieved later by calling the ```/api/v1/documents/{traceOriginalId}/technical-details/latest``` endpoint.

    ## Authentication
    The trace:original API uses Basic authentication and JSON Web Tokens (JWT) to authenticate requests.

    For Basic Authentication a username and password must be provided in the authentication header following the Basic Auth standard.

    For authentication using JSON Web Token the OAuth 2.0 flow is used to grant an access token for service integrations. Ensure that the token is securely stored on the client side and refresh JWT tokens regularly to enhance security and mitigate the risk of unauthorised access. Please note that for JWT Bearer Token authentication, the token’s expiration and renewal mechanisms might apply. Ensure proper handling and renewal of tokens for continued access to the application.

    All communication with the API must be over HTTPS, HTTP is not supported.

    ## Versioning
    The trace:original API is version controlled. Versioning is done through a version suffix in the URL using the format ```vX``` e.g. ```/api/v1/documents```. The current major version is v1. Each major backwards incompatible change will result in a new version for the affected endpoint to avoid breaking your integration. Minor changes which are backward compatible will be added to the API without versioning. All changes to the API will be documented in the [changelog](#changelog) section.

    ## Error handling

    trace:original API uses conventional HTTP response codes to indicate the success or failure of an API request. In general: Codes in the ```2xx``` range indicate success. Codes in the ```4xx``` range indicate an error that failed given the information provided (e.g., a required parameter was omitted, incorrect parameter was specified, etc.). Codes in the ```5xx``` range indicate an error with the servers (these are rare).

    Some ```4xx``` errors that could be handled programmatically (e.g., a resource was not found) include an error code that briefly explains the error reported.

    The following sample error response indicates that the version key was missing from the request:


    ```
    {
        "timestamp": "2023-03-09T10:08:56.246Z",
        "message": "Validation of input failed",
        "code": 3500,
        "details": [
            {
                "fieldName": "versionKey",
                "errorMessage": "must not be null"
            }
        ]
    }
    ```
    <br>

    | Property      | Description                                                                                                  |
    | :---        |:-------------------------------------------------------------------------------------------------------------|
    | timestamp      | UTC timestamp when the error occured                                                                         |
    | message   | A more informative description of the error                                                                  |
    | code   | An internal error code that can point to a certain issue and where that issue occurred                       |
    | details   | (Optional)  A more specific description of the error. It also shows which exact field that caused the error. |


    ## Changelog
    This section is used to list the changes which have been made to the trace:original API.

    ## Examples

    Enigio provides a Postman collection to make it easy for customers to try out the API without any implementation. 
    In order to be able to run the Postman collection you only need to fill in the server base URL, the username and the password.
    </br></br>
    <a href="trace_original_Fullnode_API.postman_collection.json" target="_blank" download>Download Postman collection</a>

