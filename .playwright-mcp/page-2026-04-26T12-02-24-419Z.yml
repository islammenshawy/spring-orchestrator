      - generic [ref=e3733]: "POST /flows → 202 Accepted + flow ID │ ├── Save flow to MongoDB (status=IN_PROGRESS) ├── Save outbox event (same DB — atomic on replica set) ├── Publish to Kafka (sync, waits for broker ack) ├── Return to caller (~5ms) │ ▼ (async — Kafka consumer, possibly different pod) │ Step 1: CREATE_DOCUMENT → vendor API → checkpoint() → outbox → Kafka Step 2: UPLOAD_ATTACHMENT → vendor API → checkpoint() → outbox → Kafka Step 3: REQUEST_SIGNATURE → vendor API → checkpoint() → outbox → Kafka Step 4: VERIFY_SIGNATURE → vendor API (poll) → outbox → Kafka Step 5: FINALIZE_DOCUMENT → vendor API → checkpoint() → COMPLETED │ On failure → retry-0 (2s) → retry-1 (4s) → retry-2 (8s) → DLT → @Compensate in reverse → FAILED"
