        - generic [ref=e3857]: Step fails (HTTP 500) ├→ commands attempt 1 FAIL ├→ commands-retry-0 2s+jitter FAIL ├→ commands-retry-1 4s+jitter FAIL ├→ commands-retry-2 8s+jitter FAIL └→ commands-dlt Dead Letter ├── flow.status = FAILED └── @Compensate in reverse
      - generic [ref=e3858]:
        - heading "Two-Layer Idempotency" [level=3] [ref=e3859]
        - generic [ref=e3860]: "Message arrives Layer 1: tryProcess(eventId) ├── duplicate → SKIP (fast path) └── first time → proceed Layer 2: completedWhen ├── TRUE → skip API (safe path) └── FALSE → execute step API → set result → checkpoint Layer 1: mark processed AFTER Key: marks AFTER, not before. Crash mid-step → redeliver → Layer 2 skips."
    - generic [ref=e3861]:
      - generic [ref=e3862]:
        - heading "Crash Recovery (3 paths)" [level=3] [ref=e3863]
        - generic [ref=e3864]: "Pod crashes after step succeeds: Path 1 — Outbox (~500ms): Publisher on any pod → polls → Kafka Path 2 — Kafka redeliver (~30s): Rebalance → new pod → Layer 2 skips Path 3 — Recovery service (~5 min): Scans stale IN_PROGRESS → re-publish"
      - generic [ref=e3865]:
        - heading "Kafka Rebalancing" [level=3] [ref=e3866]
        - generic [ref=e3867]: "CooperativeStickyAssignor: Only moving partitions pause. Others keep processing. Pod C joins: A: [P0,P1,P2] → revoke P2 → [P0,P1] ✓ B: [P3,P4,P5] → revoke P5 → [P3,P4] ✓ C: gets [P2,P5] Two-layer idempotency handles any redelivered messages."
