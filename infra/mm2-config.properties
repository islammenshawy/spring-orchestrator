# MirrorMaker 2 configuration — replicates DC-A → DC-B
# Uses default DefaultReplicationPolicy (topics prefixed with source alias)

# Cluster aliases
clusters = dc-a, dc-b
dc-a.bootstrap.servers = kafka-a:29092
dc-b.bootstrap.servers = kafka-b:29093

# Replication: dc-a → dc-b (one direction for active-passive)
dc-a->dc-b.enabled = true
dc-b->dc-a.enabled = false

# Replicate all topics starting with dis.instrument
dc-a->dc-b.topics = dis.instrument.*

# Checkpoint connector — translates consumer offsets across clusters
checkpoints.topic.replication.factor = 1
heartbeats.topic.replication.factor = 1
offset-syncs.topic.replication.factor = 1

# Replication factor for MM2 internal topics (single-broker clusters)
replication.factor = 1

# Sync consumer offsets (translates group offsets from dc-a to dc-b)
dc-a->dc-b.sync.group.offsets.enabled = true
dc-a->dc-b.emit.checkpoints.enabled = true
dc-a->dc-b.emit.heartbeats.enabled = true

# Refresh interval
refresh.topics.interval.seconds = 10
refresh.groups.interval.seconds = 10
sync.group.offsets.interval.seconds = 10

# Connect internal topics — must match single-broker RF
offset.storage.replication.factor = 1
config.storage.replication.factor = 1
status.storage.replication.factor = 1

# Performance
tasks.max = 2
