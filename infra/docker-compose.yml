services:
  # ========== MongoDB ==========
  mongodb:
    image: mongo:7.0
    ports:
      - "27117:27017"      # 27117 to avoid conflict with other projects
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  # ========== Zookeeper ==========
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: bash -c "echo srvr | nc localhost 2181 | grep Mode"
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  # ========== Kafka 3-broker cluster ==========
  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_BROKER_RACK: rack-1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092
      # Replication & durability
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Prevent data loss on failover
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      # Offset retention (30 days — covers long-running signing flows)
      KAFKA_OFFSETS_RETENTION_MINUTES: 43200
      # Timestamp index for offset recovery
      KAFKA_LOG_MESSAGE_TIMESTAMP_TYPE: CreateTime
      # Log retention
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: -1
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:9092
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9093:9093"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_BROKER_RACK: rack-2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29093,EXTERNAL://localhost:9093
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_OFFSETS_RETENTION_MINUTES: 43200
      KAFKA_LOG_MESSAGE_TIMESTAMP_TYPE: CreateTime
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: -1

  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9094:9094"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_BROKER_RACK: rack-3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29094,EXTERNAL://localhost:9094
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_OFFSETS_RETENTION_MINUTES: 43200
      KAFKA_LOG_MESSAGE_TIMESTAMP_TYPE: CreateTime
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: -1

  # ========== Mock Vendor API ==========
  mock-vendor:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        JAR_FILE: mock-vendor/target/mock-vendor-0.0.1-SNAPSHOT.jar
    ports:
      - "8081:8081"
    healthcheck:
      test: wget -qO- http://localhost:8081/actuator/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 10

  # ========== Dashboard ==========
  dashboard:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        JAR_FILE: examples/dashboard/target/dashboard-0.0.1-SNAPSHOT.jar
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
    environment:
      SPRING_MONGODB_URI: mongodb://mongodb:27017/enigio_orchestrator
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
      DIS_MONGODB_URI: mongodb://mongodb:27017/digital_instrument_service
      DIS_BASE_URL: http://digital-instrument-service:8087
    healthcheck:
      test: wget -qO- http://localhost:8080/actuator/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 10

  # ========== Sample App — Instance 1 ==========
  sample-app-1:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        JAR_FILE: examples/sample-app/target/sample-app-0.0.1-SNAPSHOT.jar
    ports:
      - "8085:8085"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      mock-vendor:
        condition: service_healthy
    environment:
      SPRING_MONGODB_URI: mongodb://mongodb:27017/enigio_orchestrator
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
      VENDOR_BASE_URL: http://mock-vendor:8081/api/v1
    healthcheck:
      test: wget -qO- http://localhost:8085/actuator/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 15

  # ========== Sample App — Instance 2 ==========
  sample-app-2:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        JAR_FILE: examples/sample-app/target/sample-app-0.0.1-SNAPSHOT.jar
    ports:
      - "8086:8085"        # different host port, same container port
    depends_on:
      mongodb:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      mock-vendor:
        condition: service_healthy
    environment:
      SPRING_MONGODB_URI: mongodb://mongodb:27017/enigio_orchestrator
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
      VENDOR_BASE_URL: http://mock-vendor:8081/api/v1
    healthcheck:
      test: wget -qO- http://localhost:8085/actuator/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 15

  # ========== Digital Instrument Service ==========
  digital-instrument-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        JAR_FILE: digital-instrument-service/target/digital-instrument-service-0.0.1-SNAPSHOT.jar
    ports:
      - "8087:8087"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      mock-vendor:
        condition: service_healthy
    environment:
      SPRING_MONGODB_URI: mongodb://mongodb:27017/digital_instrument_service
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
      VENDOR_ENIGIO_BASE_URL: http://mock-vendor:8081/api/v1
      DIS_AUTH_API_KEY: soak-test-key
      # Batch claiming config — small batches so both pods engage
      ORCHESTRATOR_RECOVERY_BATCH_SIZE: 5
      ORCHESTRATOR_RECOVERY_SCAN_INTERVAL_MS: 10000
      ORCHESTRATOR_RECOVERY_CLAIM_TTL_MINUTES: 2
      ORCHESTRATOR_RECOVERY_STALE_THRESHOLD_MINUTES: 2
    healthcheck:
      test: wget -qO- http://localhost:8087/actuator/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 15

  # ========== Nginx Load Balancer (for multi-instance DIS) ==========
  nginx:
    image: nginx:alpine
    ports:
      - "8090:8090"
    volumes:
      - ./nginx-dis.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      digital-instrument-service:
        condition: service_healthy
      digital-instrument-service-2:
        condition: service_healthy
    profiles:
      - multi-instance
    healthcheck:
      test: curl -sf http://localhost:8090/actuator/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 10

  # ========== DIS Instance 2 (for load testing + failover) ==========
  digital-instrument-service-2:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        JAR_FILE: digital-instrument-service/target/digital-instrument-service-0.0.1-SNAPSHOT.jar
    ports:
      - "8088:8087"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      mock-vendor:
        condition: service_healthy
    environment:
      SPRING_MONGODB_URI: mongodb://mongodb:27017/digital_instrument_service
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
      VENDOR_ENIGIO_BASE_URL: http://mock-vendor:8081/api/v1
      DIS_BASE_URL: http://digital-instrument-service-2:8087
      DIS_AUTH_API_KEY: soak-test-key
      # Batch claiming config — small batches so both pods engage
      ORCHESTRATOR_RECOVERY_BATCH_SIZE: 5
      ORCHESTRATOR_RECOVERY_SCAN_INTERVAL_MS: 10000
      ORCHESTRATOR_RECOVERY_CLAIM_TTL_MINUTES: 2
      ORCHESTRATOR_RECOVERY_STALE_THRESHOLD_MINUTES: 2
    profiles:
      - multi-instance
    healthcheck:
      test: wget -qO- http://localhost:8087/actuator/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  mongo-data:
