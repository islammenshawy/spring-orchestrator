server:
  port: 8080

spring:
  application:
    name: dashboard

  mongodb:
    uri: mongodb://localhost:27017/enigio_orchestrator
  thymeleaf:
    cache: false
  kafka:
    bootstrap-servers: localhost:9092

enigio:
  client:
    base-url: http://localhost:8081/api/v1

# Digital Instrument Service
dis:
  mongodb:
    uri: mongodb://localhost:27017/digital_instrument_service
  base-url: http://localhost:8087

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
