server:
  port: 8087

spring:
  application:
    name: digital-instrument-service

  mongodb:
    uri: mongodb://mongodb:27017/digital_instrument_service

  kafka:
    bootstrap-servers: kafka-1:29092,kafka-2:29093,kafka-3:29094

    # ========== Producer — stretched cluster durability ==========
    producer:
      acks: all                             # wait for ALL in-sync replicas (not just leader)
      enable-idempotence: true              # dedup at broker level on producer retry
      retries: 3                            # retry on transient network errors
      properties:
        max.in.flight.requests.per.connection: 5  # safe with idempotence enabled
        delivery.timeout.ms: 120000         # must be > request.timeout.ms (30s) for idempotence

    # ========== Consumer — stretched cluster resilience ==========
    consumer:
      auto-offset-reset: latest             # safety net only — TimestampOffsetRecoveryListener
                                            # handles offset loss via offsetsForTimes() BEFORE
                                            # auto.offset.reset applies.
      enable-auto-commit: false             # manual commit after processing (RECORD ack mode)
      properties:
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
        session.timeout.ms: 30000           # 30s — balanced crash detection
        heartbeat.interval.ms: 10000        # must be < session.timeout / 3
        max.poll.records: 50                # limit batch size
        max.poll.interval.ms: 300000        # 5 min — allows slow steps

mongock:
  migration-scan-package: com.dis.instrument.config.migration
  enabled: true

# Enigio trace:original vendor
vendor:
  enigio:
    base-url: http://mock-vendor:8081/api/v1
    connect-timeout-ms: 5000                  # TCP connect timeout
    read-timeout-ms: 30000                    # read timeout (covers seal + transfer, slowest vendor calls)

# Feign client configuration
spring.cloud.openfeign:
  client:
    config:
      default:
        connect-timeout: ${vendor.enigio.connect-timeout-ms:5000}
        read-timeout: ${vendor.enigio.read-timeout-ms:30000}
        logger-level: BASIC
  circuitbreaker:
    enabled: true

# Resilience4j circuit breaker — fast-fail on vendor outages
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    configs:
      default:
        timeout-duration: 35s

# Digital Instrument Service settings
dis:
  notifications:
    topic: dis.instrument.notifications
  signing:
    expiry-hours: 48                      # signing must complete within 48h
    poll-interval-minutes: 30             # safety-net poll frequency after webhook registered
    poll-interval-ms: 1800000             # 30 min in ms (for @Scheduled)
  approval:
    expiry-hours: 72                      # downstream must approve next phase within 72h
  webhook:
    callback-url: http://digital-instrument-service:8087/webhooks/enigio

# Orchestrator library
orchestrator:
  kafka:
    command-topic: dis.instrument.commands
    partitions: 6                             # even number for balanced multi-instance distribution

  # Execution lanes: the instrument flow runs in a dedicated "interactive" lane with its own
  # consumer group (digital-instrument-service-executor-interactive) and its own concurrency —
  # a future batch/sweep lane can never starve these partitions.
  lanes:
    interactive:
      topics: [dis.instrument.commands]
      concurrency: 3

  flows:
    enigio-instrument:
      # Vendor register/transfer calls can be slow under load — headroom over the global 60s
      # step timeout. Individual long steps can override via @Step(timeoutSeconds=...).
      step-timeout-seconds: 90

  retry:
    initial-interval-ms: 3000             # 3s first retry
    multiplier: 2.0                       # ladder: 3s → 6s → 10s (capped)
    max-interval-ms: 10000                # cap at 10s — gate steps need fast polling
    max-attempts: 10                      # 10 × 10s cap = 100s retry budget before DLT
    jitter-factor: 0.5                    # equal jitter to avoid thundering herd

# API key for endpoint authentication (override via DIS_AUTH_API_KEY env var)
dis.auth:
  api-key: ${DIS_AUTH_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
